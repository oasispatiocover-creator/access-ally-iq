  if(gs){ gs.oninput=e=>{searchQ=e.target.value; document.getElementById('searchOut').innerHTML=searchResults(); bindHits();}; bindHits(); }
  // report
  const rpb = main.querySelector('[data-report]'); if(rpb) rpb.onclick=()=>{reportCtx=currentPageName(); cameFrom=tab==='more'?'more':tab; tab='more'; sub='report'; render(); window.scrollTo(0,0)};
  const rf = document.getElementById('reportForm');
  if(rf) rf.onsubmit=e=>{e.preventDefault(); reports.unshift({date:new Date().toISOString().slice(0,10), page:rf['rp-page'].value, type:rf['rp-type'].value, text:rf['rp-text'].value.trim()}); try{localStorage.setItem('ap_reports',JSON.stringify(reports))}catch(err){}; toast('Report saved'); render();};
  // request letters
  ['name','to','address','need','contact'].forEach(k=>{const el=document.getElementById('rq-'+k); if(el) el.oninput=e=>{req[k]=e.target.value; document.getElementById('reqText').value=reqLetter(sub==='housingask'?'housing':'work')};});
  // poster
  if(document.getElementById('posterOut')){
    drawPoster();
    let t; const upd=()=>{clearTimeout(t); t=setTimeout(drawPoster,300)};
    document.getElementById('ps-name').oninput=e=>{poster.name=e.target.value;upd()};
    document.getElementById('ps-url').oninput=e=>{poster.url=e.target.value;upd()};
    document.getElementById('ps-line').onchange=e=>{poster.line=e.target.value;drawPoster()};
  }
  const sp = main.querySelector('[data-savepng]');
  if(sp) sp.onclick=async()=>{const d=document.getElementById('posterOut').dataset.png; if(!d) return; const blob=await (await fetch(d)).blob(); saveFile((poster.name.trim()||'service-animal')+'-poster.png', blob);};
  main.querySelectorAll('[data-save]').forEach(b=>b.onclick=()=>saveFile(b.dataset.fn, document.getElementById(b.dataset.save).value));
  main.querySelectorAll('[data-pick]').forEach(b=>b.onclick=()=>{setRole(b.dataset.pick);window.scrollTo(0,0)});
  // decision guide
  const fb = document.getElementById('flowBox');
  if(fb) fb.onclick = e=>{const b=e.target.closest('[data-flow]'); if(!b) return; const k=b.dataset.flow;
    if(k==='restart') flowPath=['start']; else flowPath.push(FLOW[flowPath[flowPath.length-1]][k]);
    fb.innerHTML=flowView(); const f=fb.querySelector('button'); if(f) f.focus(); };
  // quiz
  main.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>{quizAns[+b.dataset.q]=+b.dataset.a; const y=window.scrollY; render(); window.scrollTo(0,y)});
  const qr = main.querySelector('[data-quiz="reset"]'); if(qr) qr.onclick=()=>{quizAns=[];render();window.scrollTo(0,0)};
  const qn = document.getElementById('quizName'); if(qn) qn.oninput=e=>{document.getElementById('certName').textContent=e.target.value||'Your name'};
  // policy
  const bn = document.getElementById('bizName'); if(bn) bn.oninput=e=>{bizName=e.target.value;document.getElementById('policyText').value=policyText()};
  main.querySelectorAll('[data-copy]').forEach(b=>b.onclick=()=>copyFrom(b.dataset.copy));
  // letter
  const le = document.getElementById('lt-entry'); if(le) le.onchange=e=>{letterIdx=+e.target.value;render()};
  const lt = document.getElementById('lt-to'); if(lt) lt.onchange=e=>{letterTo=e.target.value;render()};
  const ln = document.getElementById('lt-name'); if(ln) ln.oninput=e=>{letterName=e.target.value;document.getElementById('letterText').value=letterText()};
  // profile
  const pf = document.getElementById('profileForm');
  if(pf){
    main.querySelectorAll('[data-idea]').forEach(b=>b.onclick=()=>{document.getElementById('pf-task').value=TASK_IDEAS[+b.dataset.idea]});
    document.getElementById('pf-photo').onchange = e=>{
      const file=e.target.files[0]; if(!file) return;
      const img=new Image(); const url=URL.createObjectURL(file);
      img.onload=()=>{const c=document.createElement('canvas');const s=Math.min(1,256/Math.max(img.width,img.height));c.width=img.width*s;c.height=img.height*s;c.getContext('2d').drawImage(img,0,0,c.width,c.height);profile.photo=c.toDataURL('image/jpeg',0.8);URL.revokeObjectURL(url);const pv=pf.querySelector('.profile-photo');const ni=document.createElement('img');ni.className='profile-photo';ni.src=profile.photo;ni.alt='';pv.replaceWith(ni)};
      img.src=url;
    };
    pf.onsubmit = e=>{e.preventDefault();
      Object.assign(profile,{dogName:pf['pf-name'].value.trim(),breed:pf['pf-breed'].value.trim(),task:pf['pf-task'].value.trim(),contactName:pf['pf-cname'].value.trim(),contactPhone:pf['pf-cphone'].value.trim(),notes:pf['pf-notes'].value.trim(),showEmergency:pf['pf-show'].checked,rabies:pf['pf-rabies'].value,chip:pf['pf-chip'].value.trim(),vet:pf['pf-vet'].value.trim()});
      try{localStorage.setItem('ap_profile',JSON.stringify(profile))}catch(err){}
      toast('Profile saved on this phone'); sub=null; tab='home'; render(); window.scrollTo(0,0);
    };
  }
  const wipe = main.querySelector('[data-wipe]');
  if(wipe) wipe.onclick=()=>{
    if(wipe.dataset.confirm){ profile={}; log=[]; try{localStorage.removeItem('ap_profile');localStorage.removeItem('ap_log')}catch(e){}; toast('Deleted from this phone'); render(); }
    else { wipe.dataset.confirm='1'; wipe.textContent='Tap again to delete everything'; }
  };
  const qs = document.getElementById('qaSearch');
  if(qs) qs.oninput = e=>{qaQuery=e.target.value;document.getElementById('qaList').innerHTML=qaList()};
  main.querySelectorAll('[data-group]').forEach(b=>b.onclick=()=>{qaGroup=b.dataset.group;main.querySelectorAll('[data-group]').forEach(c=>c.setAttribute('aria-pressed',c.dataset.group===qaGroup));document.getElementById('qaList').innerHTML=qaList()});
  document.querySelectorAll('nav.tabs button').forEach(b=>{ if(b.dataset.tab===tab) b.setAttribute('aria-current','page'); else b.removeAttribute('aria-current'); });
  const o = document.getElementById('openStaff'); if(o) o.onclick = openStaff;
  bindPlaces();
  const ps = document.getElementById('placeSearch');
  if(ps) ps.oninput = e=>{placeQuery=e.target.value;document.getElementById('placeList').innerHTML=placeList();bindPlaces()};
  main.querySelectorAll('[data-goqa]').forEach(b=>b.onclick=()=>{tab='qa';qaGroup='all';qaQuery=b.dataset.goqa;render();window.scrollTo(0,0);const d=main.querySelector('.faq details');if(d)d.open=true});
  const back = main.querySelector('[data-back]'); if(back) back.onclick=()=>{placeId=null;render()};
  const f = document.getElementById('logForm');
  if(f) f.onsubmit = e=>{
    e.preventDefault();
    log = log.filter(x=>!x.example);
    log.unshift({date:f['f-date'].value, place:f['f-place'].value.trim(), what:f['f-what'].value.trim(), outcome:f['f-outcome'].value});
    try{ localStorage.setItem('ap_log', JSON.stringify(log)); }catch(err){}
    render(); toast('Entry saved on this phone');
  };
}
const STAFF_TXT = {
  en:{close:'← Close', bigger:'Larger text', normal:'Normal text', badge:'Service animal', h1:'This dog is a service animal protected by federal law.', mayask:'Under the Americans with Disabilities Act, you may ask only:', q1:'1. Is the dog required because of a disability?', q2:'2. What work or task has it been trained to perform?', maynot:'You may not:',

    airline:'Airlines follow the Air Carrier Access Act (14 CFR Part 382) and may require the DOT Service Animal form.', training:(n,l)=>`${n} law also protects service dogs in training (${l}).`,

  es:{close:'← Cerrar', bigger:'Letra más grande', normal:'Letra normal', badge:'Animal de servicio', h1:'Este perro es un animal de servicio protegido por la ley federal.', mayask:'Según la Ley de Estadounidenses con Discapacidades (ADA), usted solo puede preguntar:', q1:'1. ¿Se requiere el perro debido a una discapacidad?', q2:'2. ¿Qué trabajo o tarea está entrenado el perro para realizar?', maynot:'Usted no puede:',

    airline:'Las aerolíneas siguen la Ley de Acceso a Transportistas Aéreos (14 CFR Parte 382) y pueden pedir el formulario del DOT para animales de servicio.', training:(n,l)=>`La ley de ${n} también protege a los perros de servicio en entrenamiento (${l}).`,

};
let staffLang = 'en';
function stopSpeak(){ try{ if('speechSynthesis' in window) speechSynthesis.cancel(); }catch(e){} }

let scale = 1;
function openStaff(){
  const p = placeId && tab==='places' ? PLACES.find(x=>x.id===placeId) : null;
  const s = STATES[state];
  const el = document.getElementById('staff');
  el.style.setProperty('--scale', scale);
  const T = STAFF_TXT[staffLang];
  const pr = profile;
  const showE = pr.showEmergency!==false && (pr.contactName||pr.contactPhone||pr.notes);
  el.innerHTML = `<div class="wrap" lang="${staffLang}">
    <div class="bar"><button id="closeStaff">${T.close}</button>
      <div style="display:flex;gap:8px"><div class="langtoggle" role="group" aria-label="Language"><button data-lang="en" aria-pressed="${staffLang==='en'}">EN</button><button data-lang="es" aria-pressed="${staffLang==='es'}">ES</button></div><button id="bigger" aria-label="${scale>1?T.normal:T.bigger}">${scale>1?'A−':'A+'}</button></div></div>
    <button id="speak" class="speakbtn" aria-pressed="false"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5L6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/></svg><span>${T.read}</span></button>
    <span class="badge">${T.badge}</span>
    <h1>${T.h1}</h1>
    ${pr.dogName?`<div class="dogline">${pr.photo?`<img src="${pr.photo}" alt="">`:''}<div><p class="sub" style="font-size:14px">${T.dog}</p><b style="font-size:calc(22px * var(--scale,1))">${esc(pr.dogName)}</b>${pr.task?`<p><span class="sub">${T.task}:</span> ${esc(pr.task)}</p>`:''}</div></div>`:''}
    <div class="sq">
      <p class="sub">${T.mayask}</p>
      <b>${T.q1}</b>
      <b>${T.q2}</b>
    </div>
    <div>
      <p style="font-weight:700;margin-bottom:6px">${T.maynot}</p>
      <ul>${T.list.map(x=>`<li>${x}</li>`).join('')}</ul>
    </div>
    <p>${T.applies}</p>
    <p>${T.remove}</p>
    ${p && p.id==='airlines' ? `<p>${T.airline}</p>` : ''}
    ${s && s.tr==='yes' ? `<p class="sub">${T.training(s.name, s.law)}</p>` : ''}
    ${showE?`<div class="emerg"><b>${T.emerg}</b><p>${T.emergDo}</p>${pr.notes?`<p>${esc(pr.notes)}</p>`:''}${pr.contactName||pr.contactPhone?`<p><b style="font-size:inherit">${T.contact}:</b> ${esc(pr.contactName||'')} <span style="user-select:all">${esc(pr.contactPhone||'')}</span></p>`:''}</div>`:''}
    <p class="cite">28 CFR §35.136 and §36.302(c) · ADA.gov · ADA Information Line 800-514-0301</p>
  </div>`;
  el.hidden = false;
  document.getElementById('closeStaff').onclick = ()=>{stopSpeak(); el.hidden=true};
  document.getElementById('bigger').onclick = ()=>{scale = scale>1?1:1.25; openStaff()};
  el.querySelectorAll('[data-lang]').forEach(b=>b.onclick=()=>{stopSpeak(); staffLang=b.dataset.lang; openStaff()});
  const spk = document.getElementById('speak');
  if(!('speechSynthesis' in window)) spk.hidden = true;
  spk.onclick = ()=>{
    if(speechSynthesis.speaking){ stopSpeak(); return; }
    const parts = [T.h1];
    if(pr.dogName) parts.push(T.dog+': '+pr.dogName+'.'+(pr.task?' '+T.task+': '+pr.task:''));
    parts.push(T.mayask, T.q1.replace(/^1\. /,''), T.q2.replace(/^2\. /,''), T.maynot, ...T.list, T.applies, T.remove);
    if(showE){ parts.push(T.emerg+'. '+T.emergDo); if(pr.notes) parts.push(pr.notes); if(pr.contactName||pr.contactPhone) parts.push(T.contact+': '+(pr.contactName||'')+' '+(pr.contactPhone||'')); }
    try{
      const u = new SpeechSynthesisUtterance(parts.join(' \n '));
      u.lang = staffLang==='es' ? 'es-US' : 'en-US'; u.rate = 0.95;
      const v = speechSynthesis.getVoices().find(v=>v.lang && v.lang.toLowerCase().startsWith(staffLang)); if(v) u.voice = v;
      u.onend = u.onerror = ()=>{ spk.setAttribute('aria-pressed','false'); spk.querySelector('span').textContent=T.read; };
      speechSynthesis.cancel(); speechSynthesis.speak(u);
      spk.setAttribute('aria-pressed','true'); spk.querySelector('span').textContent=T.stop;
    }catch(e){ spk.hidden = true; toast('Read aloud isn’t available on this device'); }
  };
  try{ navigator.wakeLock && navigator.wakeLock.request('screen').catch(()=>{}); }catch(e){}
  document.getElementById('closeStaff').focus();
}

function toast(msg){
  const t=document.createElement('div');t.className='toast';t.textContent=msg;t.setAttribute('role','status');
  document.body.appendChild(t);setTimeout(()=>t.remove(),2200);
}

document.querySelectorAll('nav.tabs button').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;placeId=null;sub=null;cameFrom='more';render();window.scrollTo(0,0)});
document.getElementById('roleBtn').onclick = showOnboard;
document.getElementById('searchBtn').onclick = ()=>{tab='search'; sub=null; placeId=null; render(); window.scrollTo(0,0); const g=document.getElementById('globalSearch'); if(g) g.focus();};
if(window.claude && window.claude.use){ window.claude.use('downloads').then(ns=>{ if(ns){ dlNS=ns; dlAvailable=true; render(); } }).catch(()=>{}); }
document.querySelectorAll('#onboard [data-role]').forEach(b=>b.onclick=()=>setRole(b.dataset.role));
document.getElementById('stateSel').onchange = e=>{state=e.target.value;try{localStorage.setItem('ap_state',state)}catch(err){};render()};
document.addEventListener('keydown',e=>{if(e.key==='Escape'){stopSpeak();document.getElementById('staff').hidden=true}});
render();
