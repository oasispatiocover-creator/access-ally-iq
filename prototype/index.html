<title>Access Ally IQ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
:root{
  --bg:#EEF3F8; --surface:#FFFFFF; --ink:#0B2350; --muted:#51627A; --line:#D4DEE9;
  --vest:#0A6FD0; --vest-ink:#FFFFFF; --vest-soft:#E0EEFB; --brand-deep:#0B2F6E; --teal:#12B5C4;
  --ok:#2F7A52; --ok-soft:#DDEFE4; --no:#B3261E; --no-soft:#F7E0DE; --maybe:#8A5A00;
  --staff-bg:#0B2350; --staff-ink:#FFFFFF; --staff-muted:#B9C6D6;
  --shadow:0 1px 2px rgba(20,38,59,.08),0 4px 16px rgba(20,38,59,.06);
  --display:"Bricolage Grotesque","Atkinson Hyperlegible",system-ui,sans-serif;
  --body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;
  --bg:#0A1426; --surface:#122039; --ink:#E6EEF8; --muted:#9AAAC0; --line:#263957;
  --vest:#4FA8F5; --vest-ink:#06142B; --vest-soft:#143056; --brand-deep:#0B3F8C; --teal:#2ED0DC;
  --ok:#6CC495; --ok-soft:#1C3328; --no:#F08A80; --no-soft:#3A2224; --maybe:#E3B341;
  --staff-bg:#000000; --staff-ink:#FFFFFF; --staff-muted:#B9C6D6;
  --shadow:0 1px 2px rgba(0,0,0,.4);
}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0A1426; --surface:#122039; --ink:#E6EEF8; --muted:#9AAAC0; --line:#263957;
  --vest:#4FA8F5; --vest-ink:#06142B; --vest-soft:#143056; --brand-deep:#0B3F8C; --teal:#2ED0DC;
  --ok:#6CC495; --ok-soft:#1C3328; --no:#F08A80; --no-soft:#3A2224; --maybe:#E3B341;
  --staff-bg:#000000; --staff-ink:#FFFFFF; --staff-muted:#B9C6D6;
  --shadow:0 1px 2px rgba(0,0,0,.4);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5}
.app{max-width:440px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;background:var(--bg)}
header.top{padding:18px 16px 8px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:10px}
.mark{width:34px;height:34px;border-radius:9px;background:var(--vest);display:grid;place-items:center}
.logo-tile{background:#fff;border-radius:10px;padding:3px 4px;display:grid;place-items:center;border:1px solid var(--line)}
.logo-tile img{display:block;width:38px;height:auto}
.brandtext{display:flex;flex-direction:column;line-height:1.1}
.brandtext small{font-size:11px;color:var(--muted);letter-spacing:.02em;white-space:nowrap}
.iq{color:var(--vest)}
.logo-full{background:#fff;border-radius:16px;padding:10px;display:inline-block;align-self:flex-start}
.logo-full img{display:block;max-width:100%;height:auto}
.brand b{white-space:nowrap;font-family:var(--display);font-weight:800;font-size:20px;letter-spacing:-.01em}
.state{font-size:13px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:4px 10px;background:var(--surface)}
main{flex:1;padding:8px 16px 110px;display:flex;flex-direction:column;gap:16px}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:26px;font-weight:800;line-height:1.15}
h2{font-size:19px;font-weight:600}
h3{font-size:16px;font-weight:600}
p{margin:0}
.muted{color:var(--muted)}
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.cite{font-family:var(--mono);font-size:12px;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:10px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid var(--vest);outline-offset:2px}
.show-btn{border:0;background:linear-gradient(135deg,#0B2F6E 0%,#0A6FD0 60%,#12A9C9 100%);color:#fff;border-radius:16px;padding:18px;text-align:left;display:flex;align-items:center;gap:14px;box-shadow:var(--shadow)}
.show-btn .big{font-family:var(--display);font-weight:800;font-size:21px;line-height:1.1}
.show-btn small{display:block;opacity:.9;font-size:14px;margin-top:3px}
.q{display:grid;grid-template-columns:30px 1fr;gap:10px;align-items:start}
.q .n{width:30px;height:30px;border-radius:50%;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-weight:700;font-family:var(--display)}
.q p{font-size:17px;font-weight:700;line-height:1.35;padding-top:2px}
.rules{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.rules li{display:grid;grid-template-columns:22px 1fr;gap:8px;align-items:start}
.tick,.cross{width:22px;height:22px;border-radius:6px;display:grid;place-items:center;font-weight:700;font-size:13px;margin-top:1px}
.tick{background:var(--ok-soft);color:var(--ok)}
.cross{background:var(--no-soft);color:var(--no)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
#placeList{display:flex;flex-direction:column;gap:22px}
.pcat{display:flex;flex-direction:column;gap:10px}
.pcat h2{font-size:17px}
.place-ex{border-style:dashed;background:transparent}
.place-ex .ic{background:var(--bg);color:var(--muted);border:1px solid var(--line)}
.law-ex{color:var(--no);border-color:var(--no);background:var(--no-soft)}
.ex-banner{background:var(--no-soft);border-color:transparent}
.dot{width:22px;height:22px;display:grid;place-items:center;color:var(--muted);font-weight:700}
.place{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;text-align:left;display:flex;flex-direction:column;gap:6px;min-height:104px}
.place .ic{width:32px;height:32px;border-radius:9px;background:var(--vest-soft);color:var(--vest);display:grid;place-items:center}
.place b{font-family:var(--display);font-weight:600;font-size:16px}
.place span{font-size:13px;color:var(--muted);line-height:1.3}
.law-tag{display:inline-block;align-self:flex-start;font-size:12px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--bg);border:1px solid var(--line);color:var(--muted)}
.back{border:0;background:none;padding:4px 0;color:var(--vest);font-weight:700;display:inline-flex;align-items:center;gap:4px;align-self:flex-start}
.compare{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:var(--surface)}
.compare table{border-collapse:collapse;width:100%;min-width:360px;font-size:14px}
.compare th,.compare td{padding:10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.compare tr:last-child td{border-bottom:0}
.compare thead th{font-family:var(--display);font-weight:600;font-size:14px}
.compare td:first-child{color:var(--muted);font-size:13px}
.y{color:var(--ok);font-weight:700}.x{color:var(--no);font-weight:700}.m{color:var(--maybe);font-weight:700}
.compare table.animals{min-width:520px}
.compare table.animals td:first-child{color:var(--ink);font-weight:700;font-size:14px;position:sticky;left:0;background:var(--surface)}
.jobs{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.job{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:4px}
.job b{font-family:var(--display);font-weight:600;font-size:15px}
.job .for{font-size:12px;font-weight:700;color:var(--vest)}
.job p{font-size:14px;line-height:1.4;color:var(--muted)}
@media (max-width:360px){.jobs{grid-template-columns:1fr}}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px))}
nav.tabs .in{max-width:440px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);gap:2px}
nav.tabs button{border:0;background:none;padding:6px 2px;border-radius:10px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;color:var(--muted);font-weight:700}
nav.tabs button[aria-current="page"]{color:var(--vest);background:var(--vest-soft)}
nav.tabs svg{width:22px;height:22px}
.disclaimer{font-size:12px;color:var(--muted);line-height:1.45}
/* staff mode */
.staff{position:fixed;inset:0;background:var(--staff-bg);color:var(--staff-ink);z-index:20;overflow-y:auto;padding:calc(16px + env(safe-area-inset-top,0px)) 16px calc(24px + env(safe-area-inset-bottom,0px))}
.staff .wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.staff .bar{display:flex;justify-content:space-between;align-items:center;gap:8px}
.staff .bar button{white-space:nowrap;background:transparent;border:1.5px solid rgba(255,255,255,.4);color:#fff;border-radius:999px;padding:8px 14px;font-weight:700;font-size:14px}
.staff .badge{display:inline-flex;align-items:center;gap:8px;background:#0A6FD0;color:#fff;border-radius:8px;padding:6px 10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;font-size:13px;align-self:flex-start}
.staff h1{font-size:calc(28px * var(--scale,1));color:#fff}
.staff p,.staff li{font-size:calc(18px * var(--scale,1));line-height:1.45}
.staff .sq{border:2px solid rgba(255,255,255,.25);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px}
.staff .sq b{font-size:calc(20px * var(--scale,1));display:block}
.staff ul{margin:0;padding-left:1.1em;display:flex;flex-direction:column;gap:6px}
.staff .cite{color:var(--staff-muted);font-size:13px}
.staff .sub{color:var(--staff-muted)}
/* log */
label{font-weight:700;font-size:14px;display:flex;flex-direction:column;gap:6px}
input,textarea,select{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%}
textarea{min-height:88px;resize:vertical}
.primary{border:0;background:var(--ink);color:var(--bg);border-radius:12px;padding:12px 16px;font-weight:700}
.entry{border-top:1px solid var(--line);padding-top:10px;display:flex;flex-direction:column;gap:4px}
.entry:first-child{border-top:0;padding-top:0}
.pill{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;padding:2px 8px;border-radius:999px;background:var(--bg);color:var(--muted);border:1px solid var(--line);align-self:flex-start}
.links{display:flex;flex-direction:column;gap:8px}
.links a{color:var(--ink);text-decoration:none;display:flex;justify-content:space-between;gap:8px;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--bg)}
.links a span{color:var(--muted);font-size:13px}
.search{position:relative}
.search input{padding-left:38px;background:var(--surface)}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px}
.chips button{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:14px;font-weight:700;color:var(--muted)}
.chips button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.faq{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.faq details{border-top:1px solid var(--line)}
.faq details:first-child{border-top:0}
.faq summary{list-style:none;cursor:pointer;padding:14px 44px 14px 16px;position:relative;display:flex;flex-direction:column;gap:4px}
.faq summary::-webkit-details-marker{display:none}
.faq summary::after{content:"+";position:absolute;right:16px;top:12px;font-size:22px;color:var(--muted);font-weight:400}
.faq details[open] summary::after{content:"\2212"}
.faq summary .said{font-size:13px;color:var(--muted);font-style:italic}
.faq summary b{font-family:var(--display);font-weight:600;font-size:16px;line-height:1.3}
.faq .ans{padding:0 16px 16px;display:flex;flex-direction:column;gap:8px}
.verdict{align-self:flex-start;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:3px 9px;border-radius:6px}
.v-myth{background:var(--no-soft);color:var(--no)}
.v-true{background:var(--ok-soft);color:var(--ok)}
.v-part{background:var(--vest-soft);color:var(--vest)}
.rolebar{padding:0 16px 4px;display:flex;gap:8px;flex-wrap:wrap}
.searchbtn{display:inline-flex;align-items:center;gap:6px;flex:1;min-width:160px;justify-content:flex-start}
.report-row{padding-top:18px;display:flex;justify-content:center}
.report-row button{border:0;background:none;color:var(--muted);font-size:13px;text-decoration:underline;padding:8px}
.rolebtn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:13px;font-weight:700;color:var(--muted)}
.onboard{position:fixed;inset:0;z-index:40;background:var(--bg);overflow-y:auto;padding:calc(24px + env(safe-area-inset-top,0px)) 16px 24px;display:flex;align-items:flex-start;justify-content:center}
.ob-card{max-width:440px;width:100%;display:flex;flex-direction:column;gap:14px;padding-top:6vh}
.ob-opts{display:flex;flex-direction:column;gap:10px}
.ob-opts button{text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:4px}
.ob-opts button b{font-family:var(--display);font-size:18px;font-weight:600}
.ob-opts button span{color:var(--muted);font-size:14px}
.ob-opts button:first-child{border-color:var(--vest)}
.menu{display:flex;flex-direction:column;gap:18px}
.menu section{display:flex;flex-direction:column;gap:8px}
.menu h2{font-size:15px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-family:var(--body);font-weight:700}
.mlist{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.mlist button{display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;text-align:left;border:0;border-top:1px solid var(--line);background:none;padding:13px 16px}
.mlist button:first-child{border-top:0}
.mlist button b{font-weight:700;font-size:15px}
.mlist button span{display:block;font-size:13px;color:var(--muted)}
.mlist button::after{content:"\203A";font-size:22px;color:var(--muted)}
.steps{display:flex;flex-direction:column;gap:10px;margin:0;padding:0;list-style:none;counter-reset:s}
.steps li{display:grid;grid-template-columns:28px 1fr;gap:10px;counter-increment:s}
.steps li::before{content:counter(s);width:28px;height:28px;border-radius:50%;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-weight:700;font-size:14px}
.script{background:var(--bg);border-left:3px solid var(--vest);border-radius:0 10px 10px 0;padding:10px 12px;font-size:15px}
.script .who{display:block;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:4px}
.flow{display:flex;flex-direction:column;gap:12px}
.flow .fq{font-family:var(--display);font-size:19px;font-weight:600;line-height:1.3}
.flow .fbtns{display:flex;gap:10px;flex-wrap:wrap}
.flow .fbtns button{flex:1;min-width:120px;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:12px;font-weight:700}
.flow .trail{font-size:13px;color:var(--muted)}
.result-ok{background:var(--ok-soft);border-radius:12px;padding:12px}
.result-no{background:var(--no-soft);border-radius:12px;padding:12px}
.quizq{display:flex;flex-direction:column;gap:8px}
.quizq button.opt{text-align:left;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 12px}
.quizq button.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.quizq button.opt.wrong{border-color:var(--no);background:var(--no-soft)}
.copybox{width:100%;min-height:220px;font-family:var(--body);font-size:14px;line-height:1.5}
.sign{border:2px solid var(--ink);border-radius:12px;padding:16px;text-align:center;display:flex;flex-direction:column;gap:6px;background:var(--surface)}
.sign b{font-family:var(--display);font-size:20px;font-weight:800}
.profile-photo{width:72px;height:72px;border-radius:14px;object-fit:cover;background:var(--bg);border:1px solid var(--line)}
.dogcard{display:flex;gap:12px;align-items:center}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.langtoggle{display:flex;border:1.5px solid rgba(255,255,255,.4);border-radius:999px;overflow:hidden}
.staff .langtoggle button{border:0;border-radius:0;padding:8px 12px}
.staff .langtoggle button[aria-pressed="true"]{background:#fff;color:#14263B}
.staff .emerg{background:#fff;color:#14263B;border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:6px}
.staff .emerg b{font-size:calc(18px * var(--scale,1))}
.staff .dogline{display:flex;gap:12px;align-items:center}
.staff .dogline img{width:64px;height:64px;border-radius:12px;object-fit:cover}
.staff .speakbtn{align-self:flex-start;display:inline-flex;align-items:center;gap:8px;background:#fff;color:#0B2350;border:0;border-radius:999px;padding:10px 16px;font-weight:700;font-size:15px}
.staff .speakbtn[aria-pressed="true"]{background:#12B5C4;color:#06142B}
.skip{position:absolute;left:-999px;top:0}
.skip:focus{left:16px;top:8px;z-index:50;background:var(--ink);color:var(--bg);padding:8px 12px;border-radius:8px}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-weight:700;font-size:14px;z-index:30}
@media (prefers-reduced-motion:no-preference){.view{animation:in .18s ease-out}@keyframes in{from{opacity:.4;transform:translateY(4px)}to{opacity:1;transform:none}}}
</style>

const PLACES = [
  {id:'restaurants', icon:'food', name:'Restaurants & cafés', hint:'Health codes don’t override the ADA', law:'ADA Title III',
   cite:'28 CFR §36.302(c) · FDA Food Code §6-501.115',
   can:['Allowed anywhere customers can go, including dining rooms and patios','Staff may ask the two questions if the task isn’t obvious'],
   cannot:['Refuse entry because of health code rules about animals','Seat the handler in a separate or worse area','Charge a pet fee or deposit'],
   notes:'The FDA Food Code, which health departments base their rules on, allows service animals in dining and sales areas. The business doesn’t have to let the dog sit on chairs or eat at the table, and staff do not have to feed or care for it. Kitchens and food prep areas stay off limits.'},
  {id:'stores', icon:'store', name:'Stores & groceries', hint:'Including where food is sold', law:'ADA Title III', cite:'28 CFR §36.302(c)',
   can:['Allowed in all public areas of the store','Staff may ask the two questions if the task isn’t obvious'],
   cannot:['Ask for a certificate, ID card, or vest','Deny access because another shopper is allergic or afraid'],
   notes:'Service dogs generally stay on the floor. A small dog may be carried, but it shouldn’t ride in a cart’s seat or basket where food goes.'},
  {id:'hotels', icon:'hotel', name:'Hotels & lodging', hint:'No pet fees, any room type', law:'ADA Title III', cite:'28 CFR §36.302(c)(8)',
   can:['Book any room type, not only “pet-friendly” rooms','Hotel may bill for actual damage, the same as any guest'],
   cannot:['Charge a pet deposit or cleaning fee','Require the dog to stay in a crate or be left in the room'],
   notes:'If the dog is left alone in a room and disturbs others, that may count as not being under control.'},
  {id:'rides', icon:'ride', name:'Taxis & rideshare', hint:'Drivers can’t refuse for allergies', law:'ADA Titles II & III', cite:'49 CFR §37.167(d)',
   can:['Ride in taxis, Uber, Lyft, buses, and trains','Report a refusal to the rideshare company, which bans drivers who deny service animals'],
   cannot:['Refuse the ride because of the dog','Charge extra for the dog'],
   notes:'Uber and Lyft both have written service animal policies. A screenshot of the ride receipt helps if you file a report.'},
  {id:'events', icon:'events', name:'Concerts & events', hint:'Stadiums, festivals, fairs, theaters', law:'ADA Titles II & III', cite:'28 CFR §36.302(c) · 28 CFR §35.136 · DOJ ADA Service Animal FAQ',
   can:['Attend concerts, games, festivals, fairs, theaters, and theme parks. “No pets” and “no animals” policies don’t apply to service dogs','Security may screen you and check the dog’s gear the same way it checks bags','The venue may keep the dog out of animal exhibits where the animals are natural prey or predators of dogs, such as some livestock barns at a fair. The dog must be allowed everywhere else','Staff may ask the two questions if the dog’s task isn’t obvious'],
   cannot:['Make you buy a ticket or pay a fee for the dog','Require you to sit in a separate section because of the dog','Require you to call ahead or register the dog before the event','Turn you away because the event will be loud or crowded','Remove the dog because another guest is allergic or afraid'],
   notes:'The dog stays at your feet or under your seat and can’t block aisles or exits. Repeated barking or lunging in a crowd can count as out of control, so plan for noise, fireworks, and crowds. Many handlers bring dog ear protection and water, and check pavement heat at outdoor summer events. Calling the venue’s accessibility office ahead is optional, but it can get you a seat with more floor space. Emotional support animals aren’t covered.'},
  {id:'airlines', icon:'plane', name:'Airlines', hint:'DOT forms and the 48-hour rule', law:'Air Carrier Access Act', cite:'14 CFR Part 382',
   can:['Airlines may require the DOT Service Animal Air Transportation Form. It’s the only form they can ask for','On flights of 8 hours or more, airlines may also require the DOT Relief Attestation Form, saying the dog won’t relieve itself or can do so safely','If you booked more than 48 hours ahead, the airline can ask for the forms up to 48 hours before departure','If you booked within 48 hours, you can hand in the forms at the gate','Up to 2 service dogs per passenger','Airlines may require a leash, harness, or tether','The dog must fit on your lap or in your foot space. If it doesn’t, the airline must first offer another seat in the same class, then other options such as a later flight'],
   cannot:['Require any documents other than the DOT forms','Charge a fee for a service dog','Make you check in at the counter because of the dog','Refuse without giving you the reason in writing'],
   notes:'An airline can refuse a dog that is a direct threat, causes a significant disruption, or doesn’t meet health rules, including the destination’s entry rules. Psychiatric service dogs are treated like any other service dog. Emotional support animals and dogs in training fly as pets. If you missed the 48-hour deadline, the airline must still try to accommodate you if it won’t delay the flight.<br><br><b>International flights:</b> foreign airlines must follow these rules on flights to or from the U.S. Check your destination’s import rules months ahead, and see Traveling abroad in the More tab for coming home.<br><br><b>If there’s a problem:</b> ask for the airline’s Complaints Resolution Official (CRO). Every airline must have one available at the airport, in person or by phone. You can also call the DOT disability hotline at 1-800-778-4838.<div class="links" style="margin-top:10px"><a href="https://www.transportation.gov/sites/dot.gov/files/2024-09/Service%20Animal%20-%20Air%20Transportation%20Form%20FINAL%209.20.24.pdf" target="_blank" rel="noopener">DOT Air Transportation Form <span>PDF ↗</span></a><a href="https://www.transportation.gov/sites/dot.gov/files/2024-09/Service%20Animals%20Relief%20-%20Final%209.20.24.pdf" target="_blank" rel="noopener">DOT Relief Attestation Form <span>PDF ↗</span></a><a href="https://www.transportation.gov/airconsumer/complaints-alleging-discriminatory-treatment-against-disabled-travelers" target="_blank" rel="noopener">File a DOT complaint <span>↗</span></a></div>'},
  {id:'housing', icon:'home', name:'Housing & rentals', hint:'Apartments, HOAs, condos', law:'Fair Housing Act', cite:'42 U.S.C. §3604(f) · 24 CFR §100.204 · HUD/DOJ Joint Statement (2004)',
   can:['Live in “no pets” housing, including apartments, condos, and HOA communities','Ask for the accommodation out loud or in writing. No special words are needed, and a family member can ask for you','If the disability or need isn’t obvious, the landlord may ask for reliable proof, such as a letter from a doctor, therapist, or other provider who knows you','Emotional support animals are covered here too','The landlord may charge for actual damage, the same way it does for any tenant'],
   cannot:['Charge pet rent, pet fees, or a pet deposit for an assistance animal','Ask for your diagnosis, medical records, or how severe your disability is','Deny you just because you didn’t use the landlord’s own form','Take so long to answer that the delay works as a denial','Refuse based on breed or size alone, without looking at your specific animal'],
   notes:'A landlord can deny a request only if your specific animal is a real threat based on its actual behavior, or the request would be an undue burden. A few kinds of housing are exempt from the Fair Housing Act, such as an owner-occupied building with 4 or fewer units, but federally funded housing and state laws may still cover you. You have 1 year to file with HUD and 2 years to sue.<br><br>See <b>Asking your landlord</b> in the More tab for steps and a sample letter.<div class="links" style="margin-top:10px"><a href="https://www.hud.gov/fairhousing" target="_blank" rel="noopener">HUD Fair Housing <span>↗</span></a></div>'},
  {id:'hospitals', icon:'hospital', name:'Hospitals & clinics', hint:'Most areas are open', law:'ADA Titles II & III', cite:'28 CFR §36.302(c)',
   can:['Allowed in exam rooms, patient rooms, cafeterias, and waiting areas','Hospital may exclude the dog from sterile areas'],
   cannot:['Exclude the dog from general patient areas','Require the handler to arrange care that isn’t needed'],
   notes:'Operating rooms and burn units are common exceptions because the dog could compromise a sterile environment.'},
  {id:'work', icon:'work', name:'Workplace', hint:'Handled as an accommodation', law:'ADA Title I', cite:'29 CFR §1630.9 · EEOC · Job Accommodation Network',
   can:['Ask to bring your dog as a reasonable accommodation. Plain words are enough, and it doesn’t have to be in writing, though writing helps','If the disability isn’t obvious, the employer may ask for documentation of the disability and why you need the dog','The employer may ask for reasonable proof the dog is trained and won’t disrupt work, such as a trainer’s statement','A short trial period, often a few weeks, is common','An emotional support animal may also be considered, since workplace rules don’t use the service animal definition'],
   cannot:['Retaliate against you for asking','Refuse without talking it through with you (the “interactive process”)','Deny just because a coworker is allergic, without trying to accommodate both of you'],
   notes:'Workplace rules are different from stores and restaurants. The two-question rule doesn’t apply here. An employer can deny only if the dog would cause undue hardship or a direct threat. Employers with 15 or more employees are covered, and many state laws cover smaller ones. You have 180 days to file with the EEOC, or 300 days in most states that have their own agency.<br><br>See <b>Asking your employer</b> in the More tab for steps and a sample request.<div class="links" style="margin-top:10px"><a href="https://askjan.org/topics/servanim.cfm" target="_blank" rel="noopener">Job Accommodation Network: service animals <span>↗</span></a></div>'},
  {id:'schools', icon:'school', name:'Schools & colleges', hint:'Public and private', law:'ADA Titles II & III', cite:'28 CFR §35.136',
   can:['Students with service dogs may attend classes and events','The school isn’t required to provide a handler for the dog'],
   cannot:['Require the family to buy extra insurance','Ask for proof of training or certification'],
   notes:'Young students may need an adult handler. The school can discuss this with the family.'}
];

PLACES.push(
  // Everyday
  {id:'gyms', cat:'everyday', icon:'gym', name:'Gyms & fitness', hint:'You stay in charge of the dog', law:'ADA Title III', cite:'28 CFR §36.302(c)',
   can:['Bring the dog onto the gym floor, into classes, and into locker rooms','Use any equipment while the dog stays close and under control','Staff may ask the two questions'],
   cannot:['Require the dog to wait in a car, a crate, or a separate room','Charge a fee or make you sign a special waiver for the dog'],
   notes:'Staff don’t have to watch or care for the dog. Keep it clear of moving equipment and walkways. Pools must allow the dog on the deck, but health rules can keep it out of the water.'},
  {id:'salons', cat:'everyday', icon:'store', name:'Salons, barbers & spas', hint:'Includes nail and massage studios', law:'ADA Title III', cite:'28 CFR §36.302(c)',
   can:['Bring the dog into the waiting area and to your chair or table','The dog may lie next to you during the service'],
   cannot:['Refuse the appointment because of the dog','Make the dog wait outside or in a car'],
   notes:'If a spot is tight, such as a small treatment room, work out with staff where the dog can lie so it isn’t in the way. A true sterile or hazard area can have limits, but that’s rare in a salon.'},
  {id:'government', cat:'everyday', icon:'gov', name:'Government offices', hint:'DMV, city hall, social services', law:'ADA Title II', cite:'28 CFR §35.136',
   can:['Bring the dog into any area open to the public, including service counters and waiting rooms','Staff may ask the two questions'],
   cannot:['Ask for a service dog license, ID, or proof of training','Make you leave the dog outside to get service'],
   notes:'State and local government offices follow ADA Title II, which uses the same service dog rules as businesses. Some states also require a normal dog license, which applies to all dogs.'},
  {id:'federal', cat:'everyday', icon:'gov', name:'Post offices & federal buildings', hint:'Different law, same idea', law:'Rehabilitation Act §504', cite:'29 U.S.C. §794',
   can:['Bring the dog into post offices, Social Security offices, VA facilities, and other federal buildings open to the public'],
   cannot:['Deny service because of a service dog'],
   notes:'Federal agencies aren’t covered by the ADA. They follow Section 504 of the Rehabilitation Act, which gives similar protection. Security screening at federal buildings still applies to you and the dog’s gear.'},
  {id:'laundromats', cat:'everyday', icon:'store', name:'Laundromats, banks & gas stations', hint:'Any business open to the public', law:'ADA Title III', cite:'42 U.S.C. §12181(7)(F)',
   can:['Bring the dog into banks, laundromats, dry cleaners, gas station stores, repair shops, and similar businesses'],
   cannot:['Point to a “no dogs” sign as a reason to refuse','Charge a fee for the dog'],
   notes:'The ADA lists these “service establishments” by name. If a business is open to the public, the same two-question rule applies.'},
  // Health
  {id:'doctors', cat:'health', icon:'hospital', name:'Doctors, dentists & pharmacies', hint:'Includes urgent care and labs', law:'ADA Title III', cite:'28 CFR §36.302(c)',
   can:['Bring the dog into waiting rooms, exam rooms, and pharmacy lines','Ask staff to let the dog stay with you during a procedure when it’s safe'],
   cannot:['Require you to leave the dog in the car','Ask about your disability beyond what’s needed for your medical care'],
   notes:'Your doctor can ask about your health for your treatment. That’s separate from the two service dog questions. Sterile rooms, such as some surgery areas, can exclude the dog.'},
  {id:'vets', cat:'health', icon:'paw', name:'Vet clinics & pet stores', hint:'Other animals nearby', law:'ADA Title III', cite:'28 CFR §36.302(c)',
   can:['Bring your service dog when you take another pet to the vet','Bring your service dog into pet stores and groomers as a customer'],
   cannot:['Refuse because the business is worried about other animals, unless your dog is out of control'],
   notes:'These places are full of distractions and untrained pets that may lunge at your dog. Keep your dog close, and ask for a quieter spot in the waiting room if needed.'},
  {id:'nursing', cat:'health', icon:'heart', name:'Nursing homes & assisted living', hint:'Visitors and residents', law:'ADA Title III · Fair Housing Act', cite:'28 CFR §36.302(c) · 42 U.S.C. §3604(f)',
   can:['Visitors may bring a service dog into common areas and a resident’s room','Residents may keep a service dog, and often an emotional support animal, as a housing accommodation'],
   cannot:['Charge a pet deposit or pet rent for a resident’s assistance animal','Ban a visitor’s service dog because other residents have allergies'],
   notes:'A resident usually needs to be able to care for the dog, or arrange care. The facility doesn’t have to provide that care. Some units, such as memory care, may have added safety rules.'},
  // Food & drink
  {id:'bars', cat:'food', icon:'drink', name:'Bars, breweries & wineries', hint:'Liquor rules don’t override the ADA', law:'ADA Title III', cite:'28 CFR §36.302(c)',
   can:['Bring the dog into bars, taprooms, tasting rooms, and lounges','Sit at the bar or a table with the dog on the floor'],
   cannot:['Refuse entry because of liquor license or health code rules on animals','Seat you only on the patio because of the dog'],
   notes:'Brewing and production floors are usually closed to all customers, and they stay closed to the dog too. Crowded, loud bars can stress a dog, so watch for signs your dog needs a break.'},
  {id:'buffets', cat:'food', icon:'food', name:'Buffets & salad bars', hint:'Dog may go through the line', law:'ADA Title III', cite:'DOJ ADA Service Animal FAQ',
   can:['Walk your dog through buffet lines, salad bars, and self-serve food lines','In shelters and dorms, the dog may enter shared kitchens'],
   cannot:['Make you leave the dog at the table while you get food'],
   notes:'The Justice Department answers this directly: service animals must be allowed to accompany their handlers through self-service food lines. Keep the dog’s nose away from the food.'},
  {id:'foodtrucks', cat:'food', icon:'food', name:'Food trucks & walk-up windows', hint:'Coffee stands, ice cream shops', law:'ADA Title III', cite:'28 CFR §36.302(c)',
   can:['Order at food trucks, walk-up windows, and kiosks with your dog','Use outdoor seating areas the business provides'],
   cannot:['Refuse to serve you because of the dog'],
   notes:'Inside the truck itself is a kitchen, which is closed to all customers. Everything on the customer side is covered.'},
  // Travel
  {id:'airports', cat:'travel', icon:'plane', name:'Airports & TSA', hint:'Screening and relief areas', law:'ADA Title II · ACAA', cite:'49 CFR §27.71(h) · 14 CFR §382.51(a)(5) · TSA screening policy',
   can:['Go through security with the dog. TSA may inspect the dog and its gear, often with a visual check or pat-down','Use a service animal relief area. Airports with at least 10,000 passenger boardings a year must have one in each terminal, usually past security'],
   cannot:['TSA can’t separate you from the dog during screening','Airport shops and restaurants can’t refuse you, since they’re covered by the ADA'],
   notes:'Tell the TSA officer you have a service dog. The officer will explain how you and the dog go through the checkpoint, and you keep hold of the leash. TSA Cares can arrange extra help if you call ahead.'},
  {id:'transit', cat:'transit', icon:'train', name:'City buses, light rail & subways', hint:'Local public transit', law:'ADA Title II · DOT rules', cite:'49 CFR §37.3 · §37.167(d) · §37.173',
   can:['Ride any bus, streetcar, light rail, subway, commuter train, or ferry run by a public transit agency','Use stations, platforms, elevators, and waiting areas with the dog','The driver or operator may ask if the animal is a service animal and what tasks it performs','Sit where the dog can lie at your feet without blocking the aisle or doors'],
   cannot:['Ask for a card, ID, or any documentation for the dog','Require the dog to ride in a carrier or muzzle','Charge a fare for the dog','Refuse to let you board because another rider is allergic or afraid'],
   notes:'Transit agencies follow Department of Transportation rules, which define a service animal as any animal individually trained to do tasks for a person with a disability. That definition isn’t limited to dogs. The dog can be removed if it is out of control or a direct threat, such as biting. Transit agencies must train drivers to treat riders with disabilities respectfully. In a 2014 case, the FTA found a Virginia transit agency broke the rules by demanding a “special card” from a rider with a diabetic alert dog and ordering the rider off the bus.'},
  {id:'paratransit', cat:'transit', icon:'ride', name:'Paratransit & Dial-a-Ride', hint:'Door-to-door rides for riders with disabilities', law:'ADA Title II · DOT rules', cite:'49 CFR §37.123 · §37.167(d)',
   can:['Bring your service dog on every paratransit ride','Mention the dog when you book, so the driver can plan space in the vehicle'],
   cannot:['Refuse a trip because of the service dog','Require the dog to ride in a carrier','Charge a fare for the dog'],
   notes:'Paratransit is the shared-ride service transit agencies must offer to people whose disabilities keep them from using regular buses or trains. Emotional support animals aren’t covered. In 2011, the FTA sided with Valley Metro in Phoenix when it required an untrained emotional support dog on Dial-a-Ride to ride in a carrier. The owner admitted the dog had no task training.'},
  {id:'amtrak', cat:'transit', icon:'train', name:'Amtrak & long-distance trains', hint:'Relief stops matter', law:'ADA · DOT rules', cite:'49 CFR §37.167(d) · Amtrak service animal policy',
   can:['Bring a service dog in all passenger areas, including coach, sleeper cars, and the café car','Walk the dog at station stops when the schedule allows. Stay close to the train and get back on promptly','Staff may ask what task the dog performs'],
   cannot:['Require documentation or certification','Charge a fare for the dog'],
   notes:'The dog must be housebroken and stay under your seat or at your feet. Litter boxes, pee pads, and diapers aren’t allowed on board, so plan relief stops on long routes. Tell the conductor when you board if you’ll need to walk the dog. Amtrak doesn’t allow service dogs in training. Emotional support animals follow Amtrak’s pet rules, which allow small pets in carriers on many routes for a fee. Amtrak: 1-800-USA-RAIL.'},
  {id:'intercity', cat:'transit', icon:'ride', name:'Greyhound & intercity buses', hint:'Dog stays at your feet', law:'ADA Title III · DOT rules', cite:'49 CFR Part 37, Subpart H · Greyhound policy',
   can:['Ride Greyhound, FlixBus, Megabus, and other intercity buses with a service dog','Get help from Greyhound’s disability assistance line: 1-800-752-4841, TTY 1-800-345-3109'],
   cannot:['Charge a fare for the dog','Refuse to sell you a ticket or let you board because of the dog'],
   notes:'Greyhound requires the dog to stay on the floor in the space around your feet, not on a seat, in your lap, or in the aisle. Plan for rest stops on long trips. Greyhound’s ADA compliance team takes complaints at ada.support@greyhound.com and says it usually finishes investigating within 30 days.'},
  {id:'cruises', cat:'travel', icon:'ship', name:'Cruise ships', hint:'Ports add their own rules', law:'ADA Title III', cite:'Spector v. Norwegian Cruise Line (2005)',
   can:['Bring a service dog on cruises from U.S. ports, at least while the ship is in U.S. waters. The Supreme Court held that the ADA applies to foreign-flagged ships there','Ask the cruise line for a relief area, which lines usually set up on a deck'],
   cannot:['Charge a fee for the dog','Refuse the booking because of the dog'],
   notes:'Most cruise lines ask for notice weeks ahead. That’s mostly because each foreign port has its own import rules, such as rabies tests and health certificates. If you can’t meet a port’s rules, the dog may have to stay on board there. Check each port early.'},
  {id:'rentals', cat:'travel', icon:'key', name:'Airbnb & vacation rentals', hint:'Platform rules plus the ADA', law:'Platform policy · ADA Title III', cite:'42 U.S.C. §12181(7)(A)',

  // Fun & outdoors
  {id:'parks', cat:'fun', icon:'tree', name:'National & state parks, beaches', hint:'Trails where pets are banned', law:'ADA Title II · Rehabilitation Act', cite:'28 CFR §35.136 · 29 U.S.C. §794',

  {id:'theaters', cat:'fun', icon:'film', name:'Movie theaters & bowling alleys', hint:'Arcades, escape rooms, mini golf', law:'ADA Title III', cite:'28 CFR §36.302(c)',

  {id:'zoos', cat:'fun', icon:'paw', name:'Zoos, aquariums & farms', hint:'Some exhibits can be off limits', law:'ADA Titles II & III', cite:'DOJ ADA Service Animal FAQ',

  {id:'pools', cat:'fun', icon:'pool', name:'Pools & water parks', hint:'Deck yes, water usually no', law:'ADA Titles II & III', cite:'DOJ ADA Service Animal FAQ',

  {id:'casinos', cat:'fun', icon:'events', name:'Casinos', hint:'Tribal casinos are different', law:'ADA Title III · tribal law', cite:'42 U.S.C. §12181(7)',

  {id:'interviews', cat:'school', icon:'work', name:'Job interviews', hint:'Applicants are protected', law:'ADA Title I', cite:'42 U.S.C. §12112',

const QA_GROUPS = [
  {id:'all', label:'All'},

const QA = [
  {g:'proof', v:'myth', said:'“If you can’t show a piece of paper, too bad.”', q:'Does a service dog need papers, an ID card, or a certificate?',
   a:['No. Federal law has no ID, license, or certificate for service dogs, and a business can’t ask for one. The only check allowed is the two questions.','Cards and certificates sold online carry no legal weight. Anyone can buy one, so they prove nothing either way.'],
   cite:'28 CFR §36.302(c)(6)'},
  {g:'proof', v:'myth', said:'“There should be a registry, like a medical alert bracelet.”', q:'Is there an official service dog registry?',
   a:['No. There is no government registry in the U.S. Sites that sell “registration” are private businesses, not the government.','When the Justice Department wrote the rules, it chose not to require certification. Many service dogs are trained by their owners, and professionally trained dogs can cost tens of thousands of dollars. Changing this would take a new law from Congress.'],
   cite:'DOJ ADA Title III regulations, 2010'},
  {g:'proof', v:'part', said:'“So it’s all word-based? Would they have to prove it in court?”', q:'Does a handler ever have to prove the dog is a service dog?',
   a:['Not at the door. In a lawsuit, yes. The person suing has to show they have a disability and that the dog is trained to do a task for it. Courts look at evidence such as training history and testimony.','So the two questions are a quick screen for staff, and a lawsuit is where the facts actually get tested.'],
   cite:'42 U.S.C. §12188'},
  {g:'proof', v:'myth', said:'“Real service dogs should be microchipped and scannable.”', q:'Can a microchip, vest, or tag prove a dog is a service dog?',
   a:['No. No chip, tag, vest, or app is legally recognized as proof. A dog’s microchip only links it to an owner.'],
   cite:'DOJ ADA Service Animal FAQ'},
  {g:'proof', v:'true', said:'“People faking it ruin it for everyone.”', q:'Is it illegal to pass off a pet as a service dog?',
   a:['In most states, yes. As of September 2026, 33 states, including Arizona, penalize passing off a pet as a service animal in public places, usually with a fine or a misdemeanor. A few more penalize it only in housing. Pick your state at the top of the Home screen to see its rule.','Federal law has no penalty for this, which is why state laws matter.'],
   cite:'A.R.S. §11-1024 (Arizona)'},
  {g:'business', v:'myth', said:'“It’s private property. He can refuse service to anyone.”', q:'Can a business refuse service to anyone it wants?',
   a:['Not for a reason the law protects. Stores, restaurants, hotels, and other private businesses open to the public are covered by the ADA. They can’t turn someone away because of a disability or because of their service dog.','A business can still refuse service for a reason unrelated to disability, such as a dress code applied to every customer. It can’t use a reason like that as cover for removing the dog.'],
   cite:'42 U.S.C. §12182'},
  {g:'business', v:'myth', said:'“Just say you’re closing early and she can be on her way.”', q:'Can staff make up an excuse to get a handler to leave?',
   a:['No. A made-up reason used to remove someone because of their dog is still disability discrimination. If the store stays open for other customers, that’s strong evidence in a complaint.'],
   cite:'42 U.S.C. §12182'},
  {g:'business', v:'myth', said:'“It’s a concert. No dogs allowed, period.”', q:'Can a concert, stadium, or festival ban service dogs?',
   a:['No. Concert venues, arenas, stadiums, theaters, fairs, and festivals must allow service dogs in areas open to the public, even when they have a “no pets” rule. That includes events on government property, such as county fairgrounds.','They can’t charge for the dog, seat you apart, or require you to call ahead. They can remove a dog that is out of control, such as one that barks repeatedly through a show, and they can keep dogs out of animal exhibits where the animals are natural prey or predators of dogs.'],
   cite:'28 CFR §36.302(c) · 28 CFR §35.136'},
  {g:'business', v:'part', said:'“What about people who are allergic or afraid of dogs?”', q:'What if a customer or employee is allergic to or afraid of dogs?',
   a:['Allergies and fear aren’t valid reasons to deny access. When both people need to be in the same space, the business should try to separate them, for example by seating them in different parts of the room.'],
   cite:'DOJ ADA Service Animal FAQ'},
  {g:'business', v:'true', said:'“What happened to the manager after?”', q:'What can happen to a business that wrongly refuses a service dog?',
   a:['The handler can file a complaint with the U.S. Department of Justice or a state civil rights office, or sue. Under federal law, a private lawsuit can force the business to change its policy and pay the handler’s legal fees. The Justice Department can also seek civil penalties.','Some states, including Arizona, have their own disability laws with additional remedies.'],
   cite:'42 U.S.C. §12188'},
  {g:'behavior', v:'true', said:'“Under the ADA, service dogs must be leashed.”', q:'Does a service dog have to be on a leash?',
   a:['Yes, a service dog must be leashed, harnessed, or tethered in public. The exceptions are when a leash would get in the way of the dog’s task, or the handler’s disability prevents using one.','In those cases, the dog still has to be under voice or signal control. A business can ask the handler to get an out-of-control dog under control.'],
   cite:'28 CFR §36.302(c)(4)'},
  {g:'behavior', v:'true', said:'“It was pulling and barking and misbehaving.”', q:'Can a business remove a service dog that misbehaves?',
   a:['Yes, if the dog is out of control and the handler doesn’t take effective action, or if the dog isn’t housebroken. Repeated barking, lunging, or wandering off can count. A single bark or a quick correction usually doesn’t.','The person must still be offered service without the dog.'],
   cite:'28 CFR §36.302(c)(2)'},
  {g:'behavior', v:'myth', said:'“Why didn’t the dog alert? She had to tell it what to do.”', q:'If the dog didn’t alert, or the handler gave it a command, is it fake?',
   a:['Not necessarily. Many tasks start with a cue from the handler, such as bracing, retrieving medication, or blocking. Not every service dog does alert work. Dogs can also miss an alert, the same way any medical device isn’t perfect.','Symptoms also vary a lot from person to person. Someone having a POTS, anxiety, or fainting episode may still be able to talk, or may not look sick at all. Staff aren’t allowed to judge a disability by how someone looks or acts.','Staff can’t ask for a demonstration. What matters at the door is the answer to the two questions and whether the dog is under control.'],
   cite:'28 CFR §36.302(c)(6)'},
  {g:'behavior', v:'part', said:'“Pets riding in purses and shopping carts.”', q:'Can a service dog ride in a shopping cart?',
   a:['The ADA doesn’t address carts directly. Service dogs generally walk on the floor, and food-safety rules make carts a poor place for any dog. A handler may carry a small dog if that’s part of how it works.'],
   cite:'DOJ ADA Service Animal FAQ'},
  {g:'disability', v:'myth', said:'“Isn’t asking about my condition a HIPAA violation?”', q:'Does HIPAA stop a business from asking about my disability?',
   a:['No. HIPAA only applies to doctors, hospitals, pharmacies, health insurers, and companies that handle health records for them. It doesn’t apply to a store clerk or restaurant manager.','The rule that protects your privacy at a business is the ADA. Under the ADA, staff may ask only:',
      '<b>1.</b> Is the dog a service animal required because of a disability?<br><b>2.</b> What work or task has the dog been trained to perform?',
      'Staff may not ask what your disability or diagnosis is, ask for medical records or a doctor’s note, ask to see the dog perform its task, or ask either question when the dog’s role is obvious, such as a guide dog leading a blind person.',
      'You can answer the second question by naming the task, such as “he alerts me before a medical episode,” without naming your condition.'],
   cite:'28 CFR §36.302(c)(6) · 45 CFR §160.103 (HIPAA covered entities)'},
  {g:'disability', v:'myth', said:'“POTS isn’t on the Social Security disability list.”', q:'Does a condition have to be on the Social Security list to count?',
   a:['No. The ADA’s definition of disability is much broader than Social Security’s. A condition counts if it substantially limits a major life activity, such as walking, standing, or the heart and circulatory system.','Conditions that come and go, like POTS, epilepsy, or diabetes, count when they are active. Congress added that in 2008.'],
   cite:'42 U.S.C. §12102'},
  {g:'disability', v:'true', said:'“Emotional support animals have no place in that category.”', q:'Is an emotional support animal a service dog?',
   a:['No. A dog that provides comfort just by being there isn’t a service dog under the ADA and has no right to enter stores or restaurants.','A psychiatric service dog is different. If it’s trained to do a specific task, such as interrupting a panic attack, it’s a service dog.'],
   cite:'28 CFR §36.104'},
  {g:'disability', v:'myth', said:'“I can’t afford $10,000 for a trained dog.”', q:'Does a service dog have to be professionally trained?',
   a:['No. The ADA doesn’t require professional training. Owner-trained dogs have the same rights, as long as the dog is trained to do a task and behaves in public.'],
   cite:'DOJ ADA Service Animal FAQ'},
  {g:'handlers', v:'true', said:'“Just vest your dog and keep it on a leash to avoid all this.”', q:'What can handlers do to avoid confrontations?',
   a:['A vest isn’t required, but many handlers find it cuts down on questions. Keeping the dog leashed is required in most cases.','If you’re challenged, stay calm. Answer the two questions and show the staff screen in this app. If staff still refuse, leave, then write down names, the time, and what was said in the Log tab while it’s fresh.'],
   cite:''},
  {g:'handlers', v:'true', said:'“A service dog in training has the same rights in most states.”', q:'Do service dogs in training have access rights?',
   a:['Not under federal law. Many states give them access, often only when they’re with a trainer. Arizona gives dogs in training the same access as trained service dogs. Check your state in the selector at the top.'],
   cite:'A.R.S. §11-1024 (Arizona)'},
  {g:'handlers', v:'true', said:'“Why sit there and argue? You’re making a scene.”', q:'What should I do if a business refuses my service dog?',
   a:['Arguing rarely changes a manager’s mind in the moment, and it can make a medical episode worse. These steps protect both your health and your case:',
      '<b>1. Stay calm.</b> Answer the two questions, briefly.<br><b>2. Show the staff screen</b> in this app. Many refusals end here.<br><b>3. Ask for a manager,</b> or the company’s corporate or customer service number.<br><b>4. If they still refuse, leave.</b> Staying after being told to go can lead to a trespassing complaint, even if the business was wrong.<br><b>5. Write it all down</b> in the Log tab: names, time, what was said, and any witnesses.<br><b>6. File a complaint</b> with the business’s corporate office, the Justice Department, or your state civil rights office.',
      'Taking care of yourself first is not giving up your rights. The complaint is where the business is held responsible.'],
   cite:''},
  {g:'handlers', v:'part', said:'“Always recording too.”', q:'Can I record the conversation on my phone?',
   a:['Often, yes, but it depends on your state. Most states, including Arizona, let you record a conversation you’re part of. About a dozen states, including California, Florida, and Washington, require everyone’s consent to record a private conversation.','Video in a public area of a store is usually allowed, but a business can set its own no-filming rule for its property. A recording helps most as evidence for a complaint, not as something to argue with in the moment. Be careful about posting it online.'],
   cite:''},
  {g:'business', v:'true', said:'“Call the cops and have her arrested for trespassing.”', q:'Can the police remove a handler with a service dog?',
   a:['Police respond to a trespass call like any other. They usually aren’t there to decide an ADA dispute on the spot. A handler who refuses to leave after being told to go can risk a trespass charge.','But calling the police doesn’t make the business right. If the refusal broke the ADA, the handler can still file a complaint or sue. In some states, such as Illinois and Ohio, denying a service dog access is itself a crime, and police can act against the business. Check your state card on the Home tab.','Police departments are also covered by the ADA, and the Justice Department publishes guidance for officers on the same two-question rule.'],
   cite:'28 CFR §35.136 · 720 ILCS 5/48-8 · Ohio Rev. Code §955.43'},
  {g:'business', v:'part', said:'“Now she can file a pain and suffering lawsuit.” “She’ll own that store.”', q:'Can a handler sue for money?',
   a:['Under the federal ADA, usually not. In a private lawsuit over a store or restaurant, a court can order the business to change its policies and pay the handler’s attorney fees, but it can’t award money for pain and suffering. The Justice Department can seek civil penalties.','Some state laws do allow money. California’s Unruh Act, for example, allows at least $4,000 per violation. Refusals by employers, landlords, and government agencies are covered by other laws, which can also allow damages.'],
   cite:'42 U.S.C. §12188 · Cal. Civ. Code §52'},
  {g:'business', v:'true', said:'“If he saw the dog misbehave, he can ask them to leave.”', q:'What should staff do when they doubt a service dog?',
   a:['This is the safe, legal way for staff to handle it:',
      '<b>1. Don’t judge by looks.</b> No vest, a small breed, or casual clothes doesn’t mean the dog is fake.<br><b>2. Ask the two questions,</b> only if the dog’s task isn’t obvious. Accept the answers.<br><b>3. Watch behavior, not paperwork.</b> Lunging, repeated barking, begging at tables, jumping on people, or an accident on the floor are real problems.<br><b>4. If the dog is out of control,</b> ask the handler to get it under control. If that doesn’t work, ask that the dog leave.<br><b>5. Offer to serve the person without the dog,</b> such as finishing the order while the dog waits outside with someone.<br><b>6. Never make up an excuse,</b> like “we’re closing,” to get rid of a handler.',
      'Following these steps protects the business from a complaint and from fake service dogs at the same time.'],
   cite:'28 CFR §36.302(c)'},
  {g:'behavior', v:'true', said:'“Begging at tables, a dog pooped in the dining room, two dogs attacked each other.”', q:'What behavior can get a service dog removed?',
   a:['Service dogs are trained to ignore food, people, and other animals, and to stay quiet and close. A business can remove a dog that is out of control and not corrected, or that isn’t housebroken. Examples include:',
      '• Growling, lunging, snapping, or biting<br>• Fighting with or chasing another animal<br>• Relieving itself indoors<br>• Repeated barking in a quiet place<br>• Begging, sniffing, or taking food from tables or shelves<br>• Jumping on people or wandering away from the handler',
      'Each dog is judged on its own behavior. A business can’t ban all service dogs because a different dog behaved badly.'],
   cite:'28 CFR §36.302(c)(2)'},
  {g:'business', v:'true', said:'“The ADA says one thing, but our state law says another.”', q:'What if state law and federal law say different things?',
   a:['The law that protects the person with a disability more is the one that applies. The ADA sets the minimum everywhere in the U.S., including the territories. A state can add rights, such as access for dogs in training, but it can’t take away ADA rights.','So if a state law requires a service dog ID or vest, a business still can’t demand one at the door, because the ADA doesn’t allow it.'],
   cite:'42 U.S.C. §12201(b)'},
  {g:'handlers', v:'part', said:'“She’s just a kid. Who’s in charge of the dog?”', q:'Can a child or teenager have a service dog?',
   a:['Yes. The ADA sets no minimum age. In public, the child or a parent or other adult with them can handle the dog, as long as the dog stays under control.','Businesses follow the same two-question rule. They can ask the child or the adult. At school, the school may need to give a student some help handling the dog, but staff don’t have to care for it. The Justice Department has sued schools that required families to hire a separate adult handler.','See Children and teens in the More tab for school tips.'],
   cite:'DOJ ADA Service Animal FAQ Q27'},
  {g:'disability', v:'myth', said:'“You don’t need a dog for a mental illness.” “Everyone has anxiety.”', q:'Can anxiety or PTSD qualify someone for a service dog?',
   a:['Yes, if the condition is serious enough to be a disability and the dog is trained to do a task for it. The ADA covers mental health conditions the same way it covers physical ones. Everyday worry isn’t a disability. Severe PTSD, panic disorder, or bipolar disorder can be.','The key is the task. A dog trained to interrupt panic attacks, wake someone from nightmares, or create space in crowds is a service dog. A dog that only provides comfort is an emotional support animal, with no public access rights.'],
   cite:'42 U.S.C. §12102 · 28 CFR §36.104'}
];

const TR_LABEL = {yes:['Yes','v-true'], trainer_only:['With a trainer only','v-part'], no:['No','v-myth']};
function stateCard(){
  if(state==='US' || !STATES[state]) return `<section class="card" aria-label="State rules">
    <div class="eyebrow">Federal rules only</div>
    <p>Pick your state at the top to see what your state adds, such as rights for dogs in training and penalties for faking a service dog.</p></section>`;
  const s = STATES[state];
  const [tl,tc] = TR_LABEL[s.tr];
  const misrep = s.mp
    ? `<span class="verdict v-true">Penalized</span><p>${esc(s.mp)}</p><span class="cite">${esc(s.mc)}</span>`
    : `<span class="verdict v-myth">No state penalty</span><p>${s.name} has no law penalizing someone who passes off a pet as a service animal in stores or restaurants${s.mh?'. It does penalize this in housing.':'.'}</p>`;
  return `<section class="card" aria-label="State rules">
    <div class="eyebrow">${s.name} law</div>
    <p class="muted" style="font-size:14px">Federal law applies everywhere. Here is what ${s.name} adds or changes. <b>When the two differ, the law that protects the handler more is the one that applies.</b> A state can add rights, but it can’t take away ADA rights.</p>
    ${s.territory?'<p class="muted" style="font-size:14px">Territory laws were harder to confirm than state laws. Check with the local government or the Protection &amp; Advocacy agency before relying on them.</p>':''}
    <div style="display:flex;flex-direction:column;gap:6px"><h3>Dogs in training</h3><span class="verdict ${tc}">${tl}</span><p>${esc(s.trNote)}</p></div>
    <div style="display:flex;flex-direction:column;gap:6px;border-top:1px solid var(--line);padding-top:10px"><h3>Faking a service dog</h3>${misrep}</div>
    ${s.other?`<div style="display:flex;flex-direction:column;gap:6px;border-top:1px solid var(--line);padding-top:10px"><h3>Also protected</h3><p>${esc(s.other)}</p></div>`:''}
    ${s.horse?`<p style="border-top:1px solid var(--line);padding-top:10px">State law also names miniature horses as service animals.</p>`:''}
    <span class="cite">Access law: ${esc(s.law)}</span>
    <a href="${s.src}" target="_blank" rel="noopener" class="cite" style="color:var(--vest)">Read the statute ↗</a>
  </section>`;
}

        <li><span class="cross" aria-hidden="true">✕</span><span>Ask for ID, a certificate, or a vest. There is no official registry.</span></li>
        <li><span class="cross" aria-hidden="true">✕</span><span>Ask about your disability or medical condition</span></li>
        <li><span class="cross" aria-hidden="true">✕</span><span>Ask the dog to demonstrate its task</span></li>
        <li><span class="cross" aria-hidden="true">✕</span><span>Charge a pet fee or deposit</span></li>
        <li><span class="cross" aria-hidden="true">✕</span><span>Refuse because of allergies or fear of dogs</span></li>
      </ul>
    </section>
    <section class="card" id="vest">
      <div class="eyebrow">Does a service dog need a vest?</div>
      <h2>No. A vest is optional.</h2>
      <p>Federal law does not require a service dog to wear a vest, patch, harness, ID tag, or special collar. A business can’t deny entry because the dog isn’t wearing one.</p>
      <ul class="rules">
        <li><span class="tick" aria-hidden="true">✓</span><span><b>Leash, harness, or tether is required</b> in public, unless it gets in the way of the dog’s task or the handler’s disability prevents it. Then the dog must be under voice or signal control.</span></li>
        <li><span class="tick" aria-hidden="true">✓</span><span>Local dog licensing and vaccination rules still apply, the same as for any dog.</span></li>
        <li><span class="cross" aria-hidden="true">✕</span><span>A vest doesn’t prove anything either. Staff may still ask the two questions whether or not the dog wears one.</span></li>
      </ul>
      <p class="muted" style="font-size:14px">Many handlers choose a vest anyway because it tells people not to pet the dog and cuts down on questions.</p>
      <span class="cite">28 CFR §36.302(c)(4) · DOJ ADA Service Animal FAQ</span>
    </section>
    <section class="card">
      <div class="eyebrow">A dog can be asked to leave only if</div>
      <ul class="rules">
        <li><span class="tick" aria-hidden="true">!</span><span>It is out of control and the handler doesn’t take effective action</span></li>
        <li><span class="tick" aria-hidden="true">!</span><span>It is not housebroken</span></li>
      </ul>
      <p class="muted" style="font-size:14px">Even then, the person must be offered service without the dog.</p>
      <span class="cite">28 CFR §36.302(c)(2)–(3)</span>
    </section>
    <section class="card">
      <div class="eyebrow">If you’re refused</div>
      <p>Stay calm and show the staff screen. If they still refuse, ask for a manager, then leave and write it down. Arguing can make an episode worse, and staying can lead to a trespass complaint. The complaint is where the business answers for it.</p>
      <button class="back" data-goqa="refuses my service dog" style="padding:0">See the 6 steps</button>
    </section>
    ${stateCard()}
    <p class="disclaimer">Access Ally IQ gives general legal information, not legal advice. Federal and state rules shown were last reviewed September 2026.</p>
  </div>`;
}

function placeList(){
  const q = placeQuery.trim().toLowerCase();
  const match = p => !q || (p.name+' '+p.hint+' '+p.law+' '+p.notes+' '+p.can.join(' ')+' '+p.cannot.join(' ')).toLowerCase().includes(q);
  const groups = PLACE_CATS.map(c=>{
    const items = PLACES.filter(p=>p.cat===c.id && match(p));
    if(!items.length) return '';
    return `<section class="pcat"><h2>${c.label}</h2>${c.id==='exceptions'?'<p class="muted" style="font-size:14px">Places people often assume are covered, but aren’t.</p>':''}
      <div class="grid2">${items.map(p=>`<button class="place${p.ex?' place-ex':''}" data-place="${p.id}"><span class="ic">${svg(p.icon)}</span><b>${p.name}</b><span>${p.hint}</span></button>`).join('')}</div></section>`;
  }).join('');
  return groups || '<p class="muted">No places match that. Try another word, like “hotel” or “park.”</p>';
}

function qaList(){

}

/* ---------- Policy and signs ---------- */
let bizName = '';
function policyText(){
  const n = bizName.trim() || '[Business name]';
  return `${n} Service Animal Policy

${n} welcomes people with disabilities who use service animals. Under the Americans with Disabilities Act, a service animal is a dog individually trained to do work or perform tasks for a person with a disability. In some cases a trained miniature horse may also be allowed.

1. Service animals may go anywhere customers are allowed to go.
2. When it isn’t obvious what the dog does, staff may ask only two questions: (1) Is the dog a service animal required because of a disability? (2) What work or task has the dog been trained to perform?
3. Staff will not ask about a person’s disability, ask for documentation or ID, require a vest, or ask the dog to demonstrate its task.
4. We do not charge fees or deposits for service animals. We may charge for damage a service animal causes, as we would for any customer.
5. Service animals must be leashed, harnessed, or tethered unless that interferes with their work or the person’s disability prevents it. Then the animal must be under voice or signal control.
6. We may ask that a service animal leave if it is out of control and the handler does not take effective action, or if it is not housebroken. If so, we will offer to serve the person without the animal.
7. Allergies and fear of dogs are not reasons to deny access. We will try to give everyone space.
8. Emotional support, comfort, and therapy animals are not service animals and follow our regular pet policy.
9. We are not responsible for the care or supervision of a service animal.
10. Some states also allow service dogs in training. We follow ${STATES[state]?STATES[state].name:'our state’s'} law.
11. All staff are trained on this policy. Questions go to a manager.

Adopted: ${new Date().toLocaleDateString('en-US',{year:'numeric',month:'long',day:'numeric'})}`;
}

let poster = {name:'', url:'', line:'pets'};
const QR_SRC = 'https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js';
function loadQR(){
  return new Promise(res=>{
    if(window.qrcode) return res(true);
    const sc=document.createElement('script'); sc.src=QR_SRC; sc.onload=()=>res(!!window.qrcode); sc.onerror=()=>res(false); document.head.appendChild(sc);
  });
}
let logoImg = null, skipLogo = false;
function loadLogo(){ return new Promise(res=>{ if(logoImg) return res(logoImg); const i=new Image(); i.onload=()=>{logoImg=i;res(i)}; i.onerror=()=>res(null); i.src='logo.png'; }); }
function wrapText(ctx, text, x, y, maxW, lh){
  const words=text.split(' '); let line=''; const lines=[];
  words.forEach(w=>{const t=line?line+' '+w:w; if(ctx.measureText(t).width>maxW && line){lines.push(line);line=w}else line=t}); if(line) lines.push(line);
  lines.forEach((l,i)=>ctx.fillText(l,x,y+i*lh)); return lines.length*lh;
}
async function drawPoster(){
  const out = document.getElementById('posterOut'); if(!out) return;
  const ok = await loadQR();
  const logo = skipLogo ? null : await loadLogo();
  const W=1200,H=1650, c=document.createElement('canvas'); c.width=W; c.height=H; const x=c.getContext('2d');
  x.fillStyle='#FFFFFF'; x.fillRect(0,0,W,H);
  x.fillStyle='#0B2350'; x.fillRect(0,0,W,300);
  x.fillStyle='#12B5C4'; x.fillRect(0,300,W,14);
  x.fillStyle='#FFFFFF'; x.textAlign='center'; x.font='800 96px "Bricolage Grotesque", system-ui, sans-serif';
  x.fillText('Service animals', W/2, 150); x.fillText('welcome', W/2, 255);
  x.fillStyle='#0B2350'; x.font='600 46px "Atkinson Hyperlegible", system-ui, sans-serif';
  const sub = poster.line==='pets' ? 'Pets are not permitted inside.' : poster.line==='esa' ? 'Emotional support animals are not service animals.' : 'Well-behaved pets welcome on the patio.';
  x.fillText(sub, W/2, 400);
  const url = poster.url.trim() || 'https://www.ada.gov/topics/service-animals/';
  const qs=620, qx=(W-qs)/2, qy=460;
  if(ok){
    const q = window.qrcode(0,'M'); q.addData(url); q.make();
    const n=q.getModuleCount(), cell=qs/(n+8);
    x.fillStyle='#FFFFFF'; x.fillRect(qx,qy,qs,qs); x.fillStyle='#0B2350';
    for(let r=0;r<n;r++) for(let col=0;col<n;col++) if(q.isDark(r,col)) x.fillRect(Math.floor(qx+(col+4)*cell), Math.floor(qy+(r+4)*cell), Math.ceil(cell), Math.ceil(cell));
  } else {
    x.strokeStyle='#0B2350'; x.lineWidth=4; x.strokeRect(qx,qy,qs,qs); x.font='500 34px system-ui'; x.fillStyle='#0B2350'; x.fillText('QR code unavailable offline', W/2, qy+qs/2);
  }
  x.fillStyle='#0B2350'; x.font='700 44px "Atkinson Hyperlegible", system-ui, sans-serif';
  x.fillText(poster.url.trim() ? 'Scan to read our service animal policy' : 'Scan to learn the service animal rules', W/2, 1150);
  x.font='500 34px "Atkinson Hyperlegible", system-ui, sans-serif'; x.fillStyle='#3A4A63';
  wrapText(x,'Staff may ask only: Is the dog a service animal required because of a disability? What task is it trained to perform?', W/2, 1225, 980, 46);
  if(poster.name.trim()){ x.fillStyle='#0B2350'; x.font='800 52px "Bricolage Grotesque", system-ui, sans-serif'; x.fillText(poster.name.trim(), W/2, 1400); }
  x.fillStyle='#EEF3F8'; x.fillRect(0,1470,W,180);
  if(logo){ const lh=140, lw=logo.width*lh/logo.height; x.drawImage(logo, 90, 1490, lw, lh); }
  x.textAlign='left'; x.fillStyle='#0B2350'; x.font='700 34px "Atkinson Hyperlegible", system-ui, sans-serif';
  x.fillText('Our staff is trained on', logo?300:90, 1550); x.fillText('service animal rules.', logo?300:90, 1595);
  let data;
  try{ data = c.toDataURL('image/png'); }catch(e){ if(logo && !skipLogo){ skipLogo=true; return drawPoster(); } return; }
  out.innerHTML = `<img src="${data}" alt="Poster preview: Service animals welcome${poster.name?', '+esc(poster.name):''}, with a QR code" style="width:100%;border:1px solid var(--line);border-radius:12px">`;
  out.dataset.png = data;
}

let searchQ = '';
const strip = h => String(h).replace(/<[^>]+>/g,' ').replace(/\s+/g,' ').trim();
let SEARCH_INDEX = null;
function buildIndex(){
  const idx=[];
  PLACES.forEach(p=>idx.push({kind:'Place', title:p.name, text:[p.hint,p.law,p.notes,p.can.join(' '),p.cannot.join(' ')].join(' '), go:{tab:'places',place:p.id}}));

  const subTitles={getdog:'Getting a service dog',etiquette:'Service dog etiquette',emergency:'Medical emergencies',twodogs:'Two service dogs',veterans:'Veterans',abroad:'Traveling abroad',heat:'Heat and paw safety',retire:'Retiring a service dog',help:'Free help',privacy:'Privacy',about:'About this information',minors:'Children and teens'};
  Object.keys(subTitles).forEach(k=>{ try{ idx.push({kind:'Guide', title:subTitles[k], text:strip(GUIDES[k]()), go:{sub:k}}) }catch(e){} });
  [['profile','Dog profile'],['log','Incident log'],['letter','Write a complaint'],['quiz','Staff quiz'],['policy','Sample service animal policy'],['signs','Sign wording'],['foodcode','Restaurants and the health code'],['directory','Trained business directory'],['poster','QR code door poster'],['housingask','Asking your landlord'],['workask','Asking your employer']].forEach(([k,t])=>idx.push({kind:'Tool', title:t, text:t, go:{sub:k}}));
  Object.entries(STATES).forEach(([k,v])=>idx.push({kind:v.territory?'Territory':'State', title:v.name+' law', text:[v.name,v.trNote,v.mp||'',v.other||''].join(' '), go:{state:k}}));
  idx.push({kind:'Animals', title:'Which animals count', text:strip(types()), go:{tab:'types'}});
  return idx;
}
function searchResults(){
  const q = searchQ.trim().toLowerCase(); if(q.length<2) return '<p class="muted">Type at least 2 letters. Try “vest,” “landlord,” “Puerto Rico,” or “airline.”</p>';
  SEARCH_INDEX = SEARCH_INDEX || buildIndex();
  const terms = q.split(/\s+/);
  const hits = SEARCH_INDEX.map(it=>{const t=it.title.toLowerCase(), b=it.text.toLowerCase(); if(!terms.every(w=>t.includes(w)||b.includes(w))) return null; return {it, score:terms.reduce((n,w)=>n+(t.includes(w)?5:0)+(b.split(w).length-1),0)}}).filter(Boolean).sort((a,b)=>b.score-a.score).slice(0,30);
  if(!hits.length) return '<p class="muted">Nothing matched. Try a shorter or different word.</p>';
  return `<div class="mlist">${hits.map((h,i)=>{const b=h.it.text; const pos=b.toLowerCase().indexOf(terms[0]); const snip=pos>=0?b.slice(Math.max(0,pos-40),pos+90):b.slice(0,120); return `<button data-hit="${SEARCH_INDEX.indexOf(h.it)}"><div><b>${esc(h.it.title)}</b><span>${h.it.kind} · ${esc((pos>40?'…':'')+snip)}…</span></div></button>`}).join('')}</div>`;
}

let letterIdx = 0, letterTo = 'business', letterName = '';
function letterText(){
  const e = log[letterIdx] || {date:'[date]', place:'[business]', what:'[what happened]', outcome:''};
  const dog = profile.dogName ? `my service dog, ${profile.dogName}` : 'my service dog';
  const d = e.date ? new Date(e.date+'T12:00').toLocaleDateString('en-US',{year:'numeric',month:'long',day:'numeric'}) : '[date]';
  const name = letterName.trim() || '[Your name]';
  const today = new Date().toLocaleDateString('en-US',{year:'numeric',month:'long',day:'numeric'});
  if(letterTo==='business') return `${today}

To the manager or owner of ${e.place}:

On ${d}, I visited ${e.place} with ${dog}. ${e.what}

Under the Americans with Disabilities Act, businesses open to the public must allow service animals to accompany people with disabilities (28 CFR §36.302(c)). Staff may ask only whether the dog is required because of a disability and what task it is trained to perform. They may not require documentation, a vest, or a demonstration.

I am asking that you:
1. Confirm in writing that you will allow service animals, as the law requires.
2. Train your staff on the two questions they are allowed to ask.
3. Reply within 14 days.

I would prefer to resolve this directly. If I don’t hear back, I may file a complaint with the U.S. Department of Justice or my state civil rights office.

Sincerely,
${name}`;
  const agency = letterTo==='doj' ? 'the U.S. Department of Justice, Civil Rights Division' : 'the state civil rights office';
  return `Complaint to ${agency}

Name: ${name}
Business: ${e.place}
Date of incident: ${d}

I am a person with a disability who uses a trained service dog. On ${d}, at ${e.place}, I was ${e.outcome==='Denied entry'?'denied entry':e.outcome==='Asked to leave'?'asked to leave':e.outcome==='Charged a fee'?'charged a fee':'treated unfairly'} because of ${dog}.

What happened: ${e.what}

[Confirm this is true or delete it:] My dog was under control and housebroken. I believe this violates Title III of the Americans with Disabilities Act and 28 CFR §36.302(c).

I am asking the business to change its policy and train its staff so this doesn’t happen to others.

(Add any witness names, receipts, photos, or recordings.)`;
}

    <label>Incident<select id="lt-entry">${log.map((e,i)=>`<option value="${i}" ${i===letterIdx?'selected':''}>${esc(e.date)} · ${esc(e.place)}${e.example?' (example)':''}</option>`).join('')}</select></label>
    <label>Send to<select id="lt-to"><option value="business" ${letterTo==='business'?'selected':''}>The business</option><option value="doj" ${letterTo==='doj'?'selected':''}>U.S. Department of Justice</option><option value="state" ${letterTo==='state'?'selected':''}>State civil rights office</option></select></label>
    <label>Your name<input id="lt-name" value="${esc(letterName)}"></label>
    <textarea class="copybox" id="letterText" aria-label="Letter text">${esc(letterText())}</textarea>
    <div style="display:flex;gap:10px;flex-wrap:wrap"><button class="primary" data-copy="letterText">Copy letter</button><button class="primary dl-only" data-save="letterText" data-fn="service-dog-complaint.txt" style="background:var(--vest)">Save as file</button></div>
    ${letterTo==='doj'?'<div class="links"><a href="https://civilrights.justice.gov/" target="_blank" rel="noopener">Open the Justice Department’s online form <span>↗</span></a></div><p class="muted" style="font-size:14px">Paste this into the “What happened” box.</p>':''}`;
}

  const helpS = `<section><h2>Help and about</h2><div class="mlist">${item('help','Free help','Phone lines and legal aid')}${item('privacy','Privacy','Where your data lives')}${item('about','About this information','Sources and review status')}</div></section>`;

let cameFrom = 'more';

/* ---------- Role ---------- */
let role = null;
try{ role = localStorage.getItem('ap_role'); }catch(e){}
let chosen = !!role;
if(!role) role = 'handler';
const ROLE_LABEL = {handler:'Handler view', business:'Business view', public:'Public view'};
function setRole(r){ role=r; chosen=true; try{localStorage.setItem('ap_role',r)}catch(e){}; document.getElementById('onboard').hidden=true; tab='home'; sub=null; render(); }
function showOnboard(){ document.getElementById('onboard').hidden=false; }

function copyFrom(id){
  const el = document.getElementById(id);
  const done = ()=>toast('Copied');
  try{ navigator.clipboard.writeText(el.value).then(done).catch(()=>{el.select();toast('Selected. Press copy.')}); }catch(e){ el.select(); toast('Selected. Press copy.'); }
}

function bindHits(){ main.querySelectorAll('[data-hit]').forEach(b=>b.onclick=()=>goHit(+b.dataset.hit)); }
let dlAvailable = false, dlNS = null;
async function saveFile(filename, data){
  if(!dlNS){ toast('Saving files isn’t available here. Use copy instead.'); return; }
  try{ await dlNS.save({filename, data}); toast('Saved'); }catch(e){ if(e&&e.code==='declined') return; toast('Couldn’t save the file. Use copy instead.'); }
}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}

function render(){
  main.innerHTML = (tab==='home'?home():tab==='places'?places():tab==='qa'?qa():tab==='types'?types():tab==='search'?searchView():moreView()) + (sub==='report'?'':'<div class="report-row"><button data-report>Report a problem with this page</button></div>');
  if(!dlAvailable) main.querySelectorAll('.dl-only').forEach(b=>b.hidden=true);
  document.getElementById('roleBtn').textContent = (chosen ? ROLE_LABEL[role] : 'Choose your view') + ' ▾';
  main.querySelectorAll('[data-sub]').forEach(b=>b.onclick=()=>{cameFrom = tab; tab='more'; sub=b.dataset.sub; render(); window.scrollTo(0,0)});
  const sb = main.querySelector('[data-subback]'); if(sb) sb.onclick=()=>{ if(cameFrom && cameFrom!=='more'){tab=cameFrom;} sub=null; cameFrom='more'; render(); window.scrollTo(0,0)};
  main.querySelectorAll('[data-tabgo]').forEach(b=>b.onclick=()=>{tab=b.dataset.tabgo;sub=null;render();window.scrollTo(0,0)});
  const rc = main.querySelector('[data-role-change]'); if(rc) rc.onclick=showOnboard;
